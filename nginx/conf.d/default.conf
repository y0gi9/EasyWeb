# HTTP server (serves traffic for tunnels or local HTTP)
server {
    listen 80;
    server_name _;

    # SSL certificate configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Root location - serve frontend
    location / {
        include /etc/nginx/includes/proxy_root.inc;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://easyweb-backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # WebSocket endpoint for real-time updates
    location /ws {
        proxy_pass http://easyweb-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://easyweb-backend:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://easyweb-backend:3001/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Dynamic proxy locations managed by EasyWeb
    include /etc/nginx/includes/proxy_upstreams.inc;

    location = /__easyweb/proxy-auth {
        internal;
        proxy_pass http://easyweb-backend:3001/api/proxy/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Easyweb-Upstream-Id $easyweb_upstream_id;
        proxy_set_header X-Original-URI $easyweb_original_uri;
        proxy_set_header X-Easyweb-Original-Host $easyweb_original_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Easyweb-Auth-Request "1";
    }

    location @easyweb_auth_unauthorized {
        if ($easyweb_auth_redirect = "") {
            return 401;
        }
        return 302 $easyweb_auth_redirect;
    }

    location @easyweb_auth_forbidden {
        return 403;
    }
}

