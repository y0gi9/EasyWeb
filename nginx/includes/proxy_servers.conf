# test (test7.y0gi.ca)
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name test7.y0gi.ca;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    location / {
        set $easyweb_upstream_id "8";
        set $easyweb_original_uri $request_uri;
        set $easyweb_original_host $host;
        set $easyweb_auth_redirect "";
        auth_request_set $easyweb_auth_redirect $upstream_http_x_easyweb_auth_redirect;
        auth_request /__easyweb/proxy-auth;
        error_page 401 = @easyweb_auth_unauthorized;
        error_page 403 = @easyweb_auth_forbidden;
        proxy_pass http://host.docker.internal:3333/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Authentication required
    }

    location = /__easyweb/proxy-auth {
        internal;
        proxy_pass http://easyweb-backend:3001/api/proxy/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Easyweb-Upstream-Id $easyweb_upstream_id;
        proxy_set_header X-Original-URI $easyweb_original_uri;
        proxy_set_header X-Easyweb-Original-Host $easyweb_original_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Easyweb-Auth-Request "1";
    }

    location @easyweb_auth_unauthorized {
        if ($easyweb_auth_redirect = "") {
            return 401;
        }
        return 302 $easyweb_auth_redirect;
    }

    location @easyweb_auth_forbidden {
        return 403;
    }
}

